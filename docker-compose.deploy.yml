# Pull-only stack for deploying published images (no build).
#   IMAGE_PREFIX=ghcr.io/<you> TAG=0.1.0 docker compose -f docker-compose.deploy.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge}"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/worker:${TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-knowledge}
      DATA_DIR: /data
      PROJECTS_CONFIG: /app/projects.yaml
      WORKER_CORS_ORIGINS: ${WORKER_CORS_ORIGINS:-*}
    env_file:
      - .env
    volumes:
      - graphdata:/data
      - ./projects.yaml:/app/projects.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  mcp:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/mcp:${TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-knowledge}
      DATA_DIR: /data
      MCP_PORT: "8080"
    volumes:
      - graphdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "8080:8080"

  docs:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/docs:${TAG:-latest}
    environment:
      WORKER_URL: ${PUBLIC_WORKER_URL:-http://localhost:8000}
    depends_on:
      worker:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  pgdata:
  graphdata:
