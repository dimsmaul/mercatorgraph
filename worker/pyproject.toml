[project]
name = "ckworker"
version = "0.1.0"
description = "FastAPI worker: clone, build via graphify, atomic promote"
requires-python = ">=3.12"
dependencies = [
    "ckcommon",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ckworker"]
