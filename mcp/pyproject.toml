[project]
name = "ckmcp"
version = "0.1.0"
description = "FastMCP server exposing scoped graph tools"
requires-python = ">=3.12"
dependencies = [
    "ckcommon",
    "fastmcp>=2.0",
    "networkx>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ckmcp"]
