[project]
name = "ckdocs"
version = "0.1.0"
description = "Generate Fumadocs MDX content from graphify output"
requires-python = ">=3.12"
dependencies = ["ckcommon"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ckdocs"]
