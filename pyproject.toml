[project]
name = "mercatorgraph"
version = "0.1.0"
description = "Mercatorgraph — codebase knowledge platform (Graphify-based)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["common", "worker", "mcp", "docs-gen"]

[tool.uv.sources]
ckcommon = { workspace = true }
ckworker = { workspace = true }
ckmcp = { workspace = true }
ckdocs = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ckcommon",
    "ckworker",
    "ckmcp",
    "ckdocs",
]

[tool.pytest.ini_options]
testpaths = ["common/tests", "mcp/tests", "worker/tests", "docs-gen/tests"]
asyncio_mode = "auto"
