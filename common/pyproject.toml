[project]
name = "ckcommon"
version = "0.1.0"
description = "Shared schema, config, and db for the knowledge platform"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ckcommon"]
