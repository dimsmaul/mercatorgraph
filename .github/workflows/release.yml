name: release

# Two mechanisms, both driven by the latest commit subject on main:
#   "release: major|minor|patch"  -> stable image tags  vX.Y.Z (+ :latest)
#   "beta: <anything>"            -> prerelease image tags vX.Y.Z-beta.N
# Any other commit subject -> nothing is built or tagged.

on:
  push:
    branches: [main]

permissions:
  contents: write # create git tags + GitHub releases
  packages: write # push images to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags for version computation
      - id: v
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: bash scripts/next_version.sh >> "$GITHUB_OUTPUT"
      - run: |
          echo "channel=${{ steps.v.outputs.channel }}"
          echo "version=${{ steps.v.outputs.version }}"

  publish:
    needs: version
    if: needs.version.outputs.channel != 'none'
    runs-on: ubuntu-latest
    # Docker Hub push is optional: set repo secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
    # (and optionally var DOCKERHUB_REPO, default "mercatorgraph") to also publish to
    # docker.io/<user>/<repo>:<service>-<version>. Without them, only GHCR is used.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'mercatorgraph' }}
    strategy:
      matrix:
        include:
          - name: worker
            context: .
            file: worker/Dockerfile
          - name: mcp
            context: .
            file: mcp/Dockerfile
          - name: view
            context: ./view
            file: view/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: login to docker hub (optional)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        env:
          SERVICE: ${{ matrix.name }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          semver="${VERSION#v}"
          # GHCR: one image repo per service, plain version tag (+ :latest on release)
          ghcr="${IMAGE_BASE}/${SERVICE}"
          tags="${ghcr}:${semver}"
          [ "$CHANNEL" = "release" ] && tags="${tags},${ghcr}:latest"
          # Docker Hub: single repo, service encoded in the tag (no sub-paths on Hub)
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            hub="docker.io/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO}"
            tags="${tags},${hub}:${SERVICE}-${semver}"
            [ "$CHANNEL" = "release" ] && tags="${tags},${hub}:${SERVICE}-latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # add linux/arm64 here if you distribute to arm hosts (slower builds):
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    needs: [version, publish]
    if: needs.version.outputs.channel != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag + GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VER"
          git push origin "$VER"
          pre=""
          [ "$CHANNEL" = "beta" ] && pre="--prerelease"
          gh release create "$VER" --title "$VER" --generate-notes $pre
